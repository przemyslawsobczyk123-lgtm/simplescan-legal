<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleScan PDF — mentions légales</title>
<meta name="robots" content="index,follow">
<style>
  :root {
    --bg: #003153;
    --card: #124B7A;
    --text: #FFFFFF;
    --muted: #C4C8D0;
    --divider: #2A6494;
    --accent: #2196F3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: linear-gradient(180deg, #07385C 0%, #002A48 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 24px;
    background: rgba(10, 70, 112, 0.55);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
  }
  h1 { font-size: 26px; margin: 0 0 12px; }
  h2 { font-size: 20px; margin: 28px 0 10px; }
  h3 { font-size: 16px; margin: 20px 0 8px; }
  p, li { font-size: 15px; color: var(--text); }
  ul, ol { padding-left: 22px; }
  a { color: var(--accent); text-decoration: underline; }
  a:hover { opacity: 0.85; }
  hr { border: 0; border-top: 1px solid var(--divider); margin: 24px 0; }
  code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13px;
  }
  th, td {
    border: 1px solid var(--divider);
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
  }
  th { background: rgba(255,255,255,0.06); font-weight: 700; }
  blockquote {
    margin: 12px 0;
    padding: 8px 14px;
    background: var(--card);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    color: var(--muted);
  }
  footer {
    max-width: 720px;
    margin: 24px auto 0;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<main>

</html>
